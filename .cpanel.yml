---
deployment:
  tasks:
    - export REPOPATH=$PWD
    - export DEPLOYPATH=$HOME/public_html
    - if [ -x /opt/cpanel/ea-nodejs22/bin/npm ]; then export NODEBIN=/opt/cpanel/ea-nodejs22/bin; else export NODEBIN=/opt/cpanel/ea-nodejs20/bin; fi
    - cd $REPOPATH
    - $NODEBIN/node --version
    - $NODEBIN/npm --version
    - $NODEBIN/npm ci --include=dev
    - NODE_ENV=production $NODEBIN/npm run build
    - /bin/mkdir -p $DEPLOYPATH
    - /bin/find $DEPLOYPATH -maxdepth 1 -mindepth 1 ! -name '.well-known' -exec /bin/rm -rf {} +
    - /bin/cp -R dist/. $DEPLOYPATH/
